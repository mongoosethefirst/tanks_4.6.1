name: Build TANKS V4.6.1

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pyinstaller

      - name: Build Windows
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name TANKS_V4.6.1
          --contents-directory files
          --hidden-import new
          --hidden-import join
          --hidden-import play_host
          --hidden-import play_client
          --hidden-import server
          --hidden-import network
          --hidden-import game_client_base
          home_page.py

      - name: Copy assets
        shell: python
        run: |
          import shutil

          shutil.copytree(
              "tanks/images",
              "dist/TANKS_V4.6.1/images",
              dirs_exist_ok=True
          )

          shutil.copytree(
              "tanks/fonts",
              "dist/TANKS_V4.6.1/fonts",
              dirs_exist_ok=True
          )

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TANKS_V4.6.1_Windows
          path: dist/TANKS_V4.6.1/



name: Build TANKS V4.6.1

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: TANKS_V4.6.1_Windows
          - os: macos-latest
            artifact: TANKS_V4.6.1_macOS
          - os: ubuntu-latest
            artifact: TANKS_V4.6.1_Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pyinstaller

      - name: Build game
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name TANKS_V4.6.1 \
            --contents-directory files \
            --hidden-import new \
            --hidden-import join \
            --hidden-import play_host \
            --hidden-import play_client \
            --hidden-import server \
            --hidden-import network \
            --hidden-import game_client_base \
            home_page.py

      - name: Copy assets
        shell: bash
        run: |
          cp -r tanks/images dist/TANKS_V4.6.1/images
          cp -r tanks/fonts dist/TANKS_V4.6.1/fonts

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/TANKS_V4.6.1/
